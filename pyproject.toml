[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutova-backend"
version = "0.1.0"
description = "Safeguarding-first tutoring marketplace backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.5.0",
  "cloudinary>=1.47.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
